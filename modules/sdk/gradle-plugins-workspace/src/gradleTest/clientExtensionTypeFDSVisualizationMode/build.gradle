import groovy.json.JsonSlurper

task runGradleTest

runGradleTest {
	dependsOn ":fds-visualization-mode-with-empty-schema:createClientExtensionConfig", ":fds-visualization-mode-with-schema:createClientExtensionConfig", ":fds-visualization-mode-without-schema:createClientExtensionConfig"

	doLast {
		_testClientExtensionConfigJSON("fds-visualization-mode-with-empty-schema") {
			value ->

			assert value instanceof Map

			assert !String.valueOf(value.get("typeSettings")).contains("schema")
		}

		_testClientExtensionConfigJSON("fds-visualization-mode-with-schema") {
			value ->

			assert value instanceof Map

			assert value.get("typeSettings").contains("schema={\"parts\":[{\"label\":\"Title\",\"name\":\"title\",\"required\":true},{\"label\":\"Date\",\"name\":\"date\"}]}")
		}

		_testClientExtensionConfigJSON("fds-visualization-mode-without-schema") {
			value ->

			assert value instanceof Map

			assert !String.valueOf(value.get("typeSettings")).contains("schema")
		}
	}
}

private void _testClientExtensionConfigJSON(String projectName, Closure<Void> valueClosure) {
	Project clientExtensionProject = project(":${projectName}")

	File clientExtensionBuildDir = new File(clientExtensionProject.buildDir, "liferay-client-extension-build")

	File configJSONFile = new File(clientExtensionBuildDir, "${projectName}.client-extension-config.json")

	assert configJSONFile.exists()

	JsonSlurper jsonSlurper = new JsonSlurper()

	Object jsonData = jsonSlurper.parse(configJSONFile)

	jsonData.each {
		key, value ->

		valueClosure value
	}
}