assemble:
    -   from: assets
        hashify: geolocation.js
        into: static
liferay-sample-audiences-geolocation:
    name: Liferay Sample Audiences Geolocation
    names:
        -   Time of Day
        -   Touch Device
    symbols:
        -   timeOfDay
        -   touchDevice
    type: audiencesCustomAttributes
    types:
        -   string
        -   boolean
    url: geolocation.*.js